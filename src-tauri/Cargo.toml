[package]
name = "netease-music-player"
version = "1.5.0"
description = "Cove 可沃 — multi-source immersive desktop music player"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "netease_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
md5 = "0.7"
tokio = { version = "1", features = ["macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
